title: Offensive AI Lab
url: "https://offensive-ai-lab.com"
logo: /assets/brand/oai-avatar-dark-1024.png
author:               # also tells search engines (structured data) that the lab is an organization
  name: Offensive AI Lab
  type: Organization
  url: "https://offensive-ai-lab.com"
# Lab statement: shown in the footer, and the fallback search description for pages without their own
# (every main page and profile sets one; the home page's keyword-focused one is in index.md).
description: > # this means to ignore newlines until "show_excerpts:"
  We investigate how adversaries are using and abusing AI to perform malicious tasks (LLM exploitation, defense evasion, attack automation, deepfakes, and so on). Our goal is to identify and prevent these emerging threats before they become mainstream.
# Profiles that represent the lab (structured data `sameAs` on the home and About pages).
social:
  name: Offensive AI Lab
  links:
    - https://github.com/Offensive-AI-Lab


show_excerpts: false # set to true to show excerpts on the homepage

# Minima date format
# refer to https://shopify.github.io/liquid/filters/date/ if you want to customize this
minima:
  skin: dark
  date_format: "%b %-d, %Y"

  # generate social links in footer
  social_links:
    #twitter: jekyllrb
    github: Offensive-AI-Lab
    # devto: jekyll
    # dribbble: jekyll
    # facebook: jekyll
    # flickr:   jekyll
    # instagram: jekyll
    # linkedin: jekyll
    # pinterest: jekyll
    # youtube: jekyll
    # youtube_channel: UC8CXR0-3I70i1tfPg1PAE1g
    # youtube_channel_name: CloudCannon
    # telegram: jekyll
    # googleplus: +jekyll
    # microdotblog: jekyll
    # keybase: jekyll

    # Mastodon instances
    # mastodon:
    # - username: jekyll
    #   instance: example.com
    # - username: jekyll2
    #   instance: example.com

    # GitLab instances
    # gitlab:
    # - username: jekyll
    #   instance: example.com
    # - username: jekyll2
    #   instance: example.com

# If you want to link only specific pages in your header, uncomment
# this and add the path to the pages in order as they should show up
header_pages:
  - about.md
  - research.html
  - publications.md
  - members.md
  - contact.md

# Research pages: one Markdown file per project in _research/ (see _research/_TEMPLATE.md).
# Each becomes /research/<file-name>/, appears on the /research/ hub, and gets a home-page tile.
collections:
  research:
    output: true
    permalink: /research/:name/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/brand/og-default.jpg   # social-media preview for pages without their own image
  - scope:
      path: ""
      type: research
    values:
      layout: research
      seo:
        type: ScholarlyArticle              # structured data: research pages are scholarly articles
  - scope:
      path: "members"
    values:
      profile: true                         # member profiles keep their own simple header

# Build settings
theme: minima

plugins:
 - jekyll-feed
 - jekyll-seo-tag
 - jekyll-redirect-from
 - jekyll-sitemap
